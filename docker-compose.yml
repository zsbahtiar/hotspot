x-airflow-common: &airflow-common
  build:
    context: ./de
    dockerfile: infra/airflow/Dockerfile
  platform: linux/amd64
  env_file:
    - .env
  volumes:
    - ./de/infra/airflow/dags:/opt/airflow/dags
    - ./de/infra/airflow/plugins:/opt/airflow/plugins
    - ./de/src:/opt/airflow/src
    - ./de/pyproject.toml:/opt/airflow/pyproject.toml
    - ./de/data:/opt/airflow/data
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: always

x-api-common: &api-common
  build:
    context: ./api
    dockerfile: Dockerfile
  environment:
    SERVER_HOST: 0.0.0.0
    SERVER_PORT: 8080
    ENABLE_SWAGGER: "true"
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_PORT: "9000"
    CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB:-hotspot}
    CLICKHOUSE_USERNAME: ${CLICKHOUSE_USER:-default}
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    REDIS_DB: "0"
  depends_on:
    clickhouse:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
    interval: 30s
    timeout: 5s
    retries: 3
  restart: always

services:
  postgres:
    image: postgres:18.0
    command: postgres -N ${POSTGRES_MAX_CONN:-100}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-olap_hotspot}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./de/infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}"]
      interval: 5s
      retries: 5
    restart: always

  redis:
    image: redis:8.0
    ports:
      - 127.0.0.1:${REDIS_PORT:-6379}:6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

  clickhouse:
    image: clickhouse/clickhouse-server:24.5.1
    platform: linux/amd64
    ports:
      - 127.0.0.1:${CLICKHOUSE_PORT:-8123}:8123
      - 127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9000}:9000
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-hotspot}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./de/infra/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./de/infra/clickhouse/load-seed.sh:/docker-entrypoint-initdb.d/load-seed.sh:ro
      - ./de/infra/clickhouse/seed:/seed:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - 127.0.0.1:${AIRFLOW_WEB_PORT:-8080}:8080

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      _AIRFLOW_DB_MIGRATE: ${AIRFLOW_DB_MIGRATE:-true}
      _AIRFLOW_WWW_USER_CREATE: ${_AIRFLOW_WWW_USER_CREATE:-true}
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_WEB_DEFAULT_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_WEB_DEFAULT_PASSWORD:-admin}
    restart: "no"

  api-1:
    <<: *api-common
    ports:
      - 127.0.0.1:3001:8080

  api-2:
    <<: *api-common
    ports:
      - 127.0.0.1:3002:8080

  api-3:
    <<: *api-common
    ports:
      - 127.0.0.1:3003:8080

  frontend:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8090}
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - 127.0.0.1:${NGINX_PORT:-8090}:80
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-1
      - api-2
      - api-3
      - frontend
    restart: always

volumes:
  postgres-data:
  clickhouse-data:
  redis-data:
