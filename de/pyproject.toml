[project]
name = "olap-hotspot"
version = "0.1.0"
description = "Data Warehouse dan Spatial OLAP untuk analisis titik panas kebakaran hutan Indonesia"
requires-python = ">=3.11"
dependencies = [
    "polars-lts-cpu>=1.32.0",
    "requests>=2.32.4",
    "python-dotenv>=1.1.1",
    "clickhouse-connect>=0.8.18",
    "psycopg2-binary>=2.9.10",
    "redis>=6.2.0",
    "httpx>=0.28.1",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.4.0",
    "structlog>=25.4.0",
    "pyarrow>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "black>=25.1.0",
    "ruff>=0.12.7",
    "mypy>=1.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[dependency-groups]
dev = [
    "pytest-asyncio>=1.1.0",
    "pytest>=8.4.1",
]
