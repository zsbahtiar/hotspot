info:
  contact: {}
  description: REST API for Indonesia wildfire hotspot analytics (detections, GeoJSON,
    summary, drill-down locations and periods).
  title: Hotspot API
  version: "1.0"
paths:
  /api/v1/hotspots/:
    get:
      description: Retrieve a paginated list of raw hotspot detections.
      parameters:
      - description: Max records to return (1-100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Response-domain_GetHotspotsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: List hotspots
      tags:
      - hotspots
  /api/v1/hotspots/filter-options:
    get:
      description: Distinct confidence classes, satellite names, and products (NRT/SP)
        for filter dropdowns.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Response-domain_GetFilterOptionsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Filter options
      tags:
      - hotspots
  /api/v1/hotspots/geojson:
    get:
      description: Retrieve hotspot detections as a GeoJSON FeatureCollection with
        cursor pagination. Supports date-range, time-period, location and product
        (NRT/SP) filters.
      parameters:
      - description: Start date (RFC3339)
        in: query
        name: start_date
        type: string
      - description: End date (RFC3339)
        in: query
        name: end_date
        type: string
      - description: Filter by year
        in: query
        name: year
        type: integer
      - description: Filter by semester
        in: query
        name: semester
        type: integer
      - description: Filter by quarter
        in: query
        name: quarter
        type: integer
      - description: Filter by month
        in: query
        name: month
        type: integer
      - description: Filter by week
        in: query
        name: week
        type: integer
      - description: Filter by province code
        in: query
        name: province_code
        type: string
      - description: Filter by city code
        in: query
        name: city_code
        type: string
      - description: Filter by district code
        in: query
        name: district_code
        type: string
      - description: Filter by subdistrict code
        in: query
        name: subdistrict_code
        type: string
      - description: Filter by satellite name
        in: query
        name: satellite
        type: string
      - description: Filter by confidence class
        in: query
        name: confidence
        type: string
      - description: Filter by product
        enum:
        - NRT
        - SP
        in: query
        name: product
        type: string
      - description: Pagination cursor from previous page
        in: query
        name: cursor
        type: string
      - description: Max features to return (1-50000, default 500)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Response-domain_GeoJSON'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Hotspots as GeoJSON
      tags:
      - hotspots
  /api/v1/hotspots/locations:
    get:
      description: Drill-down geographic hierarchy with hotspot counts. Returns islands
        with grouped provinces at the top level, or cities/districts/subdistricts
        as the location code is drilled down.
      parameters:
      - description: Drill into this province
        in: query
        name: province_code
        type: string
      - description: Drill into this city
        in: query
        name: city_code
        type: string
      - description: Drill into this district
        in: query
        name: district_code
        type: string
      - description: Filter by satellite name
        in: query
        name: satellite
        type: string
      - description: Filter by confidence class
        in: query
        name: confidence
        type: string
      - description: Filter by product
        enum:
        - NRT
        - SP
        in: query
        name: product
        type: string
      - description: Start date (RFC3339)
        in: query
        name: start_date
        type: string
      - description: End date (RFC3339)
        in: query
        name: end_date
        type: string
      - description: Filter by year
        in: query
        name: year
        type: integer
      - description: Filter by semester
        in: query
        name: semester
        type: integer
      - description: Filter by quarter
        in: query
        name: quarter
        type: integer
      - description: Filter by month
        in: query
        name: month
        type: integer
      - description: Filter by week
        in: query
        name: week
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Response-domain_GetLocationsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Location hierarchy
      tags:
      - hotspots
  /api/v1/hotspots/periods:
    get:
      description: Drill-down time period options (years then semesters, quarters,
        months, weeks) based on the params supplied.
      parameters:
      - description: Selected year
        in: query
        name: year
        type: integer
      - description: Selected semester
        in: query
        name: semester
        type: integer
      - description: Selected quarter
        in: query
        name: quarter
        type: integer
      - description: Selected month
        in: query
        name: month
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Response-domain_GetPeriodsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Time period options
      tags:
      - hotspots
  /api/v1/hotspots/summary:
    get:
      description: 'Aggregated dashboard summary: top provinces/cities, satellite
        and confidence distribution, overall stats, monthly stats and today''s stats.'
      parameters:
      - description: Top provinces limit (1-100, default 10)
        in: query
        name: province_limit
        type: integer
      - description: Top cities limit (1-100, default 10)
        in: query
        name: city_limit
        type: integer
      - description: Start date (RFC3339)
        in: query
        name: start_date
        type: string
      - description: End date (RFC3339)
        in: query
        name: end_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Response-domain_GetSummaryResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Dashboard summary
      tags:
      - hotspots
swagger: "2.0"
