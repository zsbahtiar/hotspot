<!DOCTYPE html>
<html>
<head>
<style>
.calendar {
  font-family: sans-serif;
  border: 1px solid #ddd;
  padding: 10px;
  display: inline-block;
}
.calendar-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
}
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 1px;
}
.calendar-day-header {
  text-align: center;
  font-weight: bold;
  font-size: 12px;
  padding: 5px 0;
  background: #f5f5f5;
}
.calendar-day {
  text-align: center;
  padding: 8px 0;
  cursor: pointer;
}
.calendar-day:hover {
  background: #e0e0e0;
}
.selected {
  background: #007bff !important;
  color: white !important;
}
.range-middle {
  background: #f0f0f0 !important;
}
</style>
</head>
<body>
<div class="calendar">
  <div class="calendar-header">
    <button onclick="previousMonth()">‹</button>
    <span id="month-year">October 2025</span>
    <button onclick="nextMonth()">›</button>
  </div>
  <div class="calendar-grid">
    <div class="calendar-day-header">Sun</div>
    <div class="calendar-day-header">Mon</div>
    <div class="calendar-day-header">Tue</div>
    <div class="calendar-day-header">Wed</div>
    <div class="calendar-day-header">Thu</div>
    <div class="calendar-day-header">Fri</div>
    <div class="calendar-day-header">Sat</div>
    <div class="calendar-day" onclick="selectDate(1)">1</div>
    <div class="calendar-day" onclick="selectDate(2)">2</div>
    <div class="calendar-day" onclick="selectDate(3)">3</div>
    <div class="calendar-day" onclick="selectDate(4)">4</div>
    <div class="calendar-day" onclick="selectDate(5)">5</div>
    <div class="calendar-day" onclick="selectDate(6)">6</div>
    <div class="calendar-day" onclick="selectDate(7)">7</div>
    <div class="calendar-day" onclick="selectDate(8)">8</div>
    <div class="calendar-day" onclick="selectDate(9)">9</div>
    <div class="calendar-day" onclick="selectDate(10)">10</div>
    <div class="calendar-day selected" onclick="selectDate(11)">11</div>
    <div class="calendar-day range-middle" onclick="selectDate(12)">12</div>
    <div class="calendar-day range-middle" onclick="selectDate(13)">13</div>
    <div class="calendar-day range-middle" onclick="selectDate(14)">14</div>
    <div class="calendar-day selected" onclick="selectDate(15)">15</div>
  </div>
</div>

<script>
function selectDate(day) {
  console.log("Selected date:", day);
  alert("Selected: " + day);
}
function previousMonth() {
  console.log("Previous month");
}
function nextMonth() {
  console.log("Next month");
}
</script>
</body>
</html>
